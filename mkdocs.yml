site_name: Mitra Engineering Hiring Playbook
site_description: One standard way to find, assess and hire engineers, from interns to architects.
copyright: Copyright &copy; 2026 Mitra AI. Maintained by the Hiring Excellence Group.
repo_url: https://github.com/YOUR-ORG/hiring-playbook
edit_uri: edit/main/docs/

theme:
  name: material
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - toc.follow

extra_css: [assets/extra.css]
extra_javascript: [assets/feedback-builder.js]

plugins:
  - search
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.tasklist: {custom_checkbox: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  version_label: "v1.0 · 10 November 2026"

nav:
  - Home: index.md
  - Process:
      - process/index.md
      - Stage details: process/stages.md
  - Role tracks:
      - roles/index.md
      - Intern: roles/intern.md
      - Software Engineer: roles/software-engineer.md
      - Senior Software Engineer: roles/senior-software-engineer.md
      - Tech Lead: roles/tech-lead.md
      - Architect: roles/architect.md
  - People: people.md
  - Interviewers:
      - Preparation: interviewers/preparation.md
      - Conducting the interview: interviewers/conducting.md
  - Evaluation methods: methods.md
  - Culture interview: culture.md
  - Feedback and decisions:
      - feedback.md
      - Feedback builder: feedback-builder.md
  - Templates:
      - kit/index.md
      - Project Hiring Brief: kit/project-hiring-brief.md
      - Interviewer preparation checklist: kit/interviewer-checklist.md
      - Interview feedback form: kit/feedback-form.md
      - HR culture interview form: kit/culture-interview-form.md
      - Assignment and case study brief: kit/assignment-brief.md
      - POC brief: kit/poc-brief.md
      - System design exercise: kit/system-design-exercise.md
      - Code review exercise: kit/code-review-exercise.md
      - Leadership scenario: kit/leadership-scenario.md
      - Architecture presentation and kata: kit/architecture-presentation.md
      - Debrief and decision note: kit/decision-note.md
      - Candidate emails: kit/candidate-emails.md
  - Governance: governance.md
  - Change log: changelog.md
